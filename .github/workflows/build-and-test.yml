name: Build & Test CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  backend-build-test:
    name: Build & Test Backend (.NET)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Backend Dependencies
      run: dotnet restore backend/backend.sln

    - name: Build Backend Solution
      run: dotnet build backend/backend.sln --no-restore --configuration Release

    - name: Run xUnit Unit Tests
      run: dotnet test backend.Tests/backend.Tests.csproj --no-build --configuration Release --verbosity normal

  frontend-build-deploy:
    name: Build & Deploy Frontend (React TypeScript)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Typecheck and Build Frontend
      run: |
        cd frontend
        npm run build

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./frontend/dist
